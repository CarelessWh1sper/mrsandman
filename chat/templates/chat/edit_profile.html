{% extends 'chat/base.html' %}

{% block title %}Edit profile | Mr. Sandman{% endblock %}

{% block content %}
<main class="auth-wrap">
    <form class="auth-card" method="post">
        {% csrf_token %}
        <div class="BoxFirst"><h1>Edit profile</h1></div>

        {% include 'chat/_form_fields.html' %}

        <button class="ButtonSubmitSign" type="submit">Save profile</button>
        <a class="auth-cancel" href="{% url 'chat:profile' user.pk %}">Cancel</a>
    </form>
</main>
{% endblock %}
