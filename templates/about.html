{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Sandman</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">
<style>
:root{color-scheme:dark;--night:#17153B;--indigo:#2E236C;--moon:#EAE6F4;--sand:#C8ACD6;--lav:#A99AE5;--dim:#A79FC4;--text:#F4F0FF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}

canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
audio{display:none}
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}

body{text-transform:none}
.navFirst,.navFirst *{text-transform:capitalize}

.moonbtn{margin-top:2vh;width:190px;height:190px;border:0;background:none;cursor:pointer;position:relative;border-radius:50%}
.moon{position:absolute;inset:20px;border-radius:50%;box-shadow:inset -40px 12px 0 0 var(--moon);
  filter:drop-shadow(0 0 22px rgba(200,172,214,.55));transform:rotate(-18deg);transition:filter .8s}
.moonbtn.on .moon{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 48px rgba(200,172,214,.95))}}
.moonbtn .hint{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:12px;color:var(--dim);white-space:nowrap}
.moonbtn:focus-visible{outline:2px solid #fff;outline-offset:4px}

.row{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:2vh}
.row .moonbtn{margin-top:0}
.skip{width:58px;height:58px;border-radius:50%;cursor:pointer;color:var(--text);
  background:rgba(200,172,214,.08);border:1px solid rgba(200,172,214,.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(169,154,229,.18);transition:all .25s}
.skip svg{width:30px;height:30px}
.skip:hover{background:rgba(200,172,214,.2);border-color:var(--sand);transform:scale(1.08);box-shadow:0 0 26px rgba(200,172,214,.4)}
.skip:active{transform:scale(.94)}
.skip:focus-visible{outline:2px solid #fff;outline-offset:4px}

.stage{flex:1;width:100%;max-width:980px;padding:0 28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.side{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(15px,2vw,20px);color:var(--dim);min-height:1.4em;opacity:.6}
.now{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(34px,6.2vw,72px);line-height:1.12;
  color:var(--text);text-shadow:0 0 40px rgba(200,172,214,.35);min-height:2.3em;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .28em}
.now span{opacity:0;transform:translateY(14px);animation:up .7s forwards}
@keyframes up{to{opacity:1;transform:none}}

footer{width:100%;max-width:760px;padding:0 28px 26px}
.info{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.info b{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:500}
.info small{color:var(--dim);font-size:13px}
.bar{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim)}
.track{flex:1;height:4px;background:rgba(200,172,214,.2);border-radius:9px;cursor:pointer;position:relative}
.fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--lav),var(--sand))}
.track:hover{height:6px}
.track::after{content:"";position:absolute;inset:-14px 0}

@media(max-width:700px){
  header.navFirst{padding:16px 18px}
  .row{gap:16px}
  .skip{width:48px;height:48px}
  .moonbtn{width:150px;height:150px}
  .moon{inset:16px;box-shadow:inset -30px 10px 0 0 var(--moon)}
  .stage{padding:0 18px}
  footer{padding:0 18px 22px}
}
@media(max-height:600px) and (orientation:landscape){
  .moonbtn{width:110px;height:110px}
  .moon{inset:12px;box-shadow:inset -24px 8px 0 0 var(--moon)}
  .row{margin-top:0}
  .now{min-height:1.6em;font-size:clamp(24px,5vw,40px)}
  footer{padding-bottom:12px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .now span{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="sky"></div>
<canvas id="sand"></canvas>

<audio id="audio" preload="metadata">
  <source src="{% static 'SYML-Mr.-Sandman-320.mp3' %}" type="audio/mpeg">
</audio>

<div class="app">
  <header class="navFirst">
    <nav>
      <span style="font-family:'asli'; font-size:25px;">Mr. Sandman</span>
    </nav>
    <input type="checkbox" id="navToggle" class="nav-check" aria-label="Toggle menu">
    <label for="navToggle" class="nav-toggle" aria-hidden="true"><span></span></label>


    <nav class="navSec">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'chat:home' %}">Tonight</a>
      <a href="{% url 'chat:archive' %}">Archive</a>
      <a href="{% url 'about' %}">About</a>
    </nav>

    <nav class="navThird">
      <a href="{% url 'chat:login' %}" class="sign">Sign in</a>
      <a href="{% url 'chat:signup' %}" class="join">Join</a>
    </nav>

  </header>

  <div class="row">
    <button class="skip" id="back" aria-label="Back 10 seconds" title="Back 10s (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/><text x="12" y="15.2" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif" font-weight="600">10</text></svg>
    </button>
  <button class="moonbtn" id="moon" aria-label="Play"><div class="moon"></div><span class="hint" id="hint">tap the moon to play</span></button>
    <button class="skip" id="fwd" aria-label="Forward 10 seconds" title="Forward 10s (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(24 0) scale(-1 1)"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></g><text x="12" y="15.2" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif" font-weight="600">10</text></svg>
    </button>
  </div>

  <div class="stage">
    <div class="side" id="prev"></div>
    <div class="now" id="now" aria-live="polite"></div>
    <div class="side" id="next"></div>
  </div>

  <footer>
    <div class="info"><b>Mr. Sandman</b><small>SYML · 2021 </small></div>
    <div class="bar"><span id="cur">0:00</span><div class="track" id="track"><div class="fill" id="fill"></div></div><span id="dur">0:00</span></div>
  </footer>
</div>

<script>
const lyrics = [
  { time: 0,      text: "♪ instrumental ♪" },
  { time: 4.04,   text: "Mr. Sandman, bring me a dream" },
  { time: 10.35,  text: "Make her the cutest that I've ever seen" },
  { time: 15.33,  text: "Give her two lips like roses and clover" },
  { time: 20.39,  text: "And tell her that her lonely nights are over" },
  { time: 25.38,  text: "Sandman, I'm so alone" },
  { time: 30.34,  text: "Don't have nobody to call my own" },
  { time: 35.02,  text: "Please turn on your magic beam" },
  { time: 39.45,  text: "Mr. Sandman, bring me a dream" },

  { time: 46.87,  text: "Mr. Sandman, bring me a dream" },
  { time: 52.83,  text: "Make her the cutest that I've ever seen" },
  { time: 57.86,  text: "Give her the word that I'm not a rover" },
  { time: 62.82,  text: "And tell her that her lonely nights are over" },
  { time: 67.39,  text: "Oh, Sandman, I'm so alone" },
  { time: 73.40,  text: "Don't have nobody to call my own" },
  { time: 77.22,  text: "So please turn on your magic beam" },
  { time: 81.91,  text: "Mr. Sandman, bring me a dream" },

  { time: 89.11,  text: "Oh, Sandman" },
  { time: 92.69,  text: "Bring us a dream" },
  { time: 95.39,  text: "Make her the cutest that I've ever seen" },
  { time: 100.56, text: "Give her two lips like roses and clover" },
  { time: 105.42, text: "And tell her that her lonely nights are over" },
  { time: 110.67, text: "Oh, Sandman, I'm so alone" },
  { time: 115.78, text: "Don't have nobody to call my own" },
  { time: 118.73, text: "So please turn on your magic beam" },
  { time: 123.58, text: "Mr. Sandman, bring me a dream" },

  { time: 134.04, text: "♪ mm hey, mm hah ♪" },

  { time: 152.68, text: "Mr. Sandman, bring me a dream" },
  { time: 158.20, text: "Make her the cutest that I've ever seen" },
  { time: 161.80, text: "Give her two lips like roses and clover" },
  { time: 167.15, text: "And tell her that her lonely nights are over" }
];

const $=id=>document.getElementById(id);
const audio=$('audio');
let idx=-1;

const fmt=s=>isFinite(s)&&s>=0
  ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')
  : '0:00';

function render(){
  const time=audio.currentTime||0;
  let i=0;
  lyrics.forEach((l,k)=>{if(time>=l.time)i=k});

  if(i!==idx){
    idx=i;
    const n=$('now');n.innerHTML='';
    lyrics[i].text.split(' ').forEach((w,k)=>{
      const s=document.createElement('span');
      s.textContent=w;
      s.style.animationDelay=(k*70)+'ms';
      n.appendChild(s);
    });
    $('prev').textContent=lyrics[i-1]?lyrics[i-1].text:'';
    $('next').textContent=lyrics[i+1]?lyrics[i+1].text:'';
  }

  const dur=isFinite(audio.duration)&&audio.duration>0?audio.duration:1;
  $('fill').style.width=(time/dur*100)+'%';
  $('cur').textContent=fmt(time);
}

audio.addEventListener('loadedmetadata',()=>{
  $('dur').textContent=fmt(audio.duration);
});

$('moon').onclick=()=>{
  if(audio.paused){
    audio.play().then(()=>{
      $('moon').classList.add('on');
      $('hint').textContent='tap to pause';
    }).catch(err=>{
      console.warn('Playback failed:',err);
      $('hint').textContent='فایل صوتی پیدا نشد';
    });
  }else{
    audio.pause();
    $('moon').classList.remove('on');
    $('hint').textContent='tap the moon to play';
  }
};

audio.addEventListener('play',()=>{
  $('moon').classList.add('on');
  $('hint').textContent='tap to pause';
});
audio.addEventListener('pause',()=>{
  $('moon').classList.remove('on');
  $('hint').textContent='tap the moon to play';
});

audio.addEventListener('timeupdate',render);


let fromMemory=false,loadingAudio=false;

function canSeek(){
  const s=audio.seekable;
  return s.length>0&&s.end(s.length-1)>=audio.duration-1;
}

async function ensureSeekable(){
  if(fromMemory||canSeek())return true;
  if(loadingAudio)return false;
  loadingAudio=true;
  try{
    const blob=await (await fetch(audio.currentSrc,{cache:'no-store'})).blob();
    const t=audio.currentTime,wasPlaying=!audio.paused;
    audio.src=URL.createObjectURL(blob);
    await new Promise(done=>audio.addEventListener('loadedmetadata',done,{once:true}));
    audio.currentTime=t;
    fromMemory=true;
    if(wasPlaying)audio.play().catch(()=>{});
    return true;
  }catch(err){
    console.warn('Could not prepare the audio for jumping:',err);
    return false;
  }finally{
    loadingAudio=false;
  }
}

$('track').onclick=async e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const pct=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
  if(!isFinite(audio.duration)||audio.duration<=0)return;
  if(!await ensureSeekable())return;
  audio.currentTime=pct*audio.duration;
  render();
};

async function skip(sec){
  if(!isFinite(audio.duration)||audio.duration<=0)return;
  if(!await ensureSeekable())return;
  audio.currentTime=Math.min(Math.max(audio.currentTime+sec,0),audio.duration);
  render();
}
$('back').onclick=()=>skip(-10);
$('fwd').onclick=()=>skip(10);
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){skip(-10)}
  if(e.code==='ArrowRight'){skip(10)}
});

addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();$('moon').click()}
});

const c=$('sand'),x=c.getContext('2d');
let W,H,P=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();
addEventListener('resize',size);
for(let i=0;i<80;i++){
  P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,v:Math.random()*.5+.2,s:Math.random()*6,star:false});
}
let speed=.3;
function draw(){
  speed+=((!audio.paused?1:.25)-speed)*.03;
  x.clearRect(0,0,W,H);
  for(const p of P){
    p.y+=p.v*speed/300;
    p.x+=Math.sin(p.s+=.01)*.0004;
    if(p.y>1.02){p.y=-.02;p.x=Math.random()}
    x.fillStyle='rgba(200,172,214,'+(.25+p.r/3)+')';
    x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill();
  }
  requestAnimationFrame(draw);
}
draw();
render();
</script>
</body>
</html>
